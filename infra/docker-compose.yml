networks:
  dmz-net:
    driver: bridge
  int-net:
    driver: bridge
  soc-net:
    driver: bridge

services:
  nginx:
    image: owasp/modsecurity-crs:nginx
    container_name: nginx-dmz
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "8080:8080"
    environment:
      - BACKEND=http://web:5000
      - PORT=8080
      - SERVER_NAME=_
    volumes:
      - ./nginx/upstream.conf:/etc/nginx/conf.d/upstream.conf:ro
    networks:
      - dmz-net
      - int-net
    depends_on:
      - web
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build: ../backend
    container_name: web-flask
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    expose:
      - "5000"
    networks:
      - dmz-net
      - int-net
    environment:
      - DB_HOST=db
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - uploads_data:/app/uploads
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - int-net
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
  uploads_data: